# TubularFlowIGA execution profile.
#
# This file controls how cases are run. Geometry, mesh, physics, time, and
# boundary conditions remain in each case's simulation_config.json.
# Relative paths are resolved from the repository root.

# Immediate subdirectories of CASE_ROOT are selected when no case names are
# passed to scripts/run_cases.sh.
CASE_ROOT=Input

# Leave empty to use CASE/generated. When set, outputs are written below
# OUTPUT_ROOT/CASE_NAME. Existing outputs are preserved unless CLEAN=1.
OUTPUT_ROOT=

# MPI ranks. A 3D database is partitioned to this count and therefore requires
# at least 2; native 1D cases may use 1 or more ranks.
RANKS=8

# cpu or cuda.
BACKEND=cpu

# Build the selected solver before running it.
BUILD_SOLVERS=1

# Replacing an existing generated case must always be explicit.
CLEAN=0

RUN_MESH_CHECK=1
RUN_SOLVER=1
RUN_VALIDATION=1

# For 3D, SOLVER may be auto, navier_stokes, or transport. Native 1D uses auto
# because iga_1d advances a selected flow system and its linked transports.
# SYSTEM selects a named 3D equation system or a named 1D flow system.
SOLVER=auto
SYSTEM=

MPIEXEC=mpiexec
OMP_NUM_THREADS=2

# Optional whitespace-separated arguments appended to the solver command.
# Quoted values containing whitespace are not supported here; invoke the
# solver directly when such arguments are needed.
SOLVER_ARGS=

# Print the commands without generating, building, or solving.
DRY_RUN=0

# PETSc may instead be exported by the calling shell.
# PETSC_DIR=/path/to/petsc
# PETSC_ARCH=arch-linux-c-opt

# Optional Makefile overrides when HDF5 is not visible to pkg-config.
# HDF5_CFLAGS=-I/path/to/hdf5/include
# HDF5_LIBS=-L/path/to/hdf5/lib -lhdf5
